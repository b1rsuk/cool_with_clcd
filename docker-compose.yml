services:
  app:
    container_name: converter
    image: ${IMAGE:-unit-converter}:${IMAGE_TAG:-local}
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
